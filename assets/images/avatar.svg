<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <radialGradient id="skin" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fde8cc"/>
      <stop offset="100%" stop-color="#f0b07a"/>
    </radialGradient>
    <radialGradient id="hair" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </radialGradient>
    <clipPath id="circ"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>

  <!-- BG -->
  <circle cx="48" cy="48" r="48" fill="url(#bg)"/>

  <!-- Shirt / body -->
  <path d="M12 96 Q12 68 48 66 Q84 68 84 96 Z" fill="#4c1d95" clip-path="url(#circ)"/>
  <path d="M34 66 Q48 73 62 66 L58 82 Q48 86 38 82 Z" fill="#6d28d9" clip-path="url(#circ)"/>

  <!-- Neck -->
  <rect x="42" y="56" width="12" height="12" rx="5" fill="url(#skin)"/>

  <!-- Head -->
  <circle cx="48" cy="47" r="20" fill="url(#skin)"/>

  <!-- Hair top -->
  <path d="M28 44 C28 24 68 24 68 44 L68 36 C68 18 28 18 28 36 Z" fill="url(#hair)"/>
  <!-- Hair sides -->
  <ellipse cx="28" cy="46" rx="4" ry="8" fill="url(#hair)"/>
  <ellipse cx="68" cy="46" rx="4" ry="8" fill="url(#hair)"/>

  <!-- Eyes -->
  <ellipse cx="40" cy="47" rx="3.2" ry="3.6" fill="white"/>
  <circle cx="40.5" cy="48" r="2.2" fill="#1a0533"/>
  <circle cx="41.3" cy="47" r="0.85" fill="white"/>

  <ellipse cx="56" cy="47" rx="3.2" ry="3.6" fill="white"/>
  <circle cx="56.5" cy="48" r="2.2" fill="#1a0533"/>
  <circle cx="57.3" cy="47" r="0.85" fill="white"/>

  <!-- Eyebrows -->
  <path d="M37 41.5 Q40 39.5 43 41.5" stroke="#2d1b69" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M53 41.5 Q56 39.5 59 41.5" stroke="#2d1b69" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M47 52 Q48 54.5 49 52" stroke="#d4895a" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M43 56.5 Q48 61 53 56.5" stroke="#b06040" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="35" cy="53" rx="4" ry="2.5" fill="#f87171" opacity="0.28"/>
  <ellipse cx="61" cy="53" rx="4" ry="2.5" fill="#f87171" opacity="0.28"/>
</svg>
